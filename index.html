<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sITE EM CONSTRUÇÃO</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
    header { background-color: #003366; padding: 20px; text-align: center; }
    header img { max-height: 80px; }
    main { padding: 30px; max-width: 900px; margin: auto; background-color: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
    section { margin-bottom: 40px; }
    h2 { color: #003366; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background-color: #003366; color: white; }
    footer { background-color: #003366; color: white; text-align: center; padding: 15px; font-size: 0.9em; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
    button { background-color: #003366; color: white; padding: 10px; border: none; cursor: pointer; }
    button:hover { background-color: #005599; }
  </style>
</head>
<body>
  <header>
